name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned upstream TruffleHog action. Scan the commits introduced by this PR/push.
      - uses: trufflesecurity/trufflehog@dc2edce2b667ca9bb1b1821d673b2385a491ff73
        with:
          version: 3.97.6
          extra_args: --results=verified,unknown,unverified
