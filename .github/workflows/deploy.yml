name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 허용

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. application.yaml 생성 (GitHub Secrets에서 통째로)
      - name: Create application.yaml
        run: |
          mkdir -p src/main/resources
          echo '${{ secrets.APPLICATION_YAML }}' > src/main/resources/application.yaml

      # 5. Firebase 서비스 계정 파일 생성
      - name: Create Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase-service-account.json

      # 6. Google Cloud 인증 파일 생성
      - name: Create Google Cloud credentials
        run: |
          echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS_JSON }}' > google-cloud-credentials.json

      # 7. Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      # 8. SSH 키 설정
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 9. JAR 파일 및 설정 파일 전송
      - name: Deploy to server
        run: |
          # JAR 파일 전송
          scp build/libs/myyak-server-*.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/myyak-server.jar

          # Firebase 인증 파일 전송
          scp firebase-service-account.json ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/firebase-service-account.json

          # Google Cloud 인증 파일 전송
          scp google-cloud-credentials.json ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/google-cloud-credentials.json

      # 10. 서버 재시작
      - name: Restart application
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # 기존 프로세스 종료
            sudo systemctl stop myyak || true

            # 애플리케이션 시작
            sudo systemctl start myyak

            # 상태 확인
            sleep 5
            sudo systemctl status myyak
          ENDSSH

      # 11. 헬스체크 (최대 90초 대기)
      - name: Health check
        run: |
          echo "Waiting for application to start..."
          for i in {1..6}; do
            sleep 15
            echo "Attempt $i: Checking health..."
            if curl -sf https://api.myyak.xyz/actuator/health; then
              echo ""
              echo "Health check passed!"
              exit 0
            fi
          done
          echo "Health check failed after 90 seconds"
          exit 1

      # 12. 실패 시 로그 확인
      - name: Check logs on failure
        if: failure()
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            echo "=== Application Logs ==="
            sudo journalctl -u myyak -n 100 --no-pager
            echo ""
            echo "=== Service Status ==="
            sudo systemctl status myyak --no-pager
          ENDSSH
