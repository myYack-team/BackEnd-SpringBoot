name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 허용

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. application.yaml 생성 (GitHub Secrets에서 통째로)
      - name: Create application.yaml
        run: |
          mkdir -p src/main/resources
          echo '${{ secrets.APPLICATION_YAML }}' > src/main/resources/application.yaml

      # 5. Firebase 서비스 계정 파일 생성
      - name: Create Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase-service-account.json

      # 6. Google Cloud 인증 파일 생성
      - name: Create Google Cloud credentials
        run: |
          echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS_JSON }}' > google-cloud-credentials.json

      # 7. Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      # 8. SSH 키 설정
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 9. 기존 JAR 백업 및 새 JAR 전송
      - name: Backup and deploy JAR
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # 기존 JAR 백업 (롤백용)
            if [ -f /home/${{ secrets.EC2_USER }}/myyak-server.jar ]; then
              cp /home/${{ secrets.EC2_USER }}/myyak-server.jar /home/${{ secrets.EC2_USER }}/myyak-server.jar.backup
              echo "기존 JAR 백업 완료: myyak-server.jar.backup"
            fi
          ENDSSH

          # JAR 파일 전송
          scp build/libs/myyak-server-*.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/myyak-server.jar

          # Firebase 인증 파일 전송
          scp firebase-service-account.json ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/firebase-service-account.json

          # Google Cloud 인증 파일 전송
          scp google-cloud-credentials.json ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/google-cloud-credentials.json

      # 10. 서버 재시작
      - name: Restart application
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # 기존 프로세스 종료
            sudo systemctl stop myyak || true

            # 애플리케이션 시작
            sudo systemctl start myyak

            # 상태 확인
            sleep 5
            sudo systemctl status myyak
          ENDSSH

      # 11. 헬스체크 (최대 90초 대기)
      - name: Health check
        id: healthcheck
        run: |
          echo "Waiting for application to start..."
          for i in {1..6}; do
            sleep 15
            echo "Attempt $i: Checking health..."
            # Swagger API docs 엔드포인트로 헬스체크 (200 또는 302 응답 확인)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.myyak.xyz/v3/api-docs)
            echo "HTTP Status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "Health check passed!"
              exit 0
            fi
          done
          echo "Health check failed after 90 seconds"
          exit 1

      # 12. 헬스체크 실패 시 롤백
      - name: Rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "헬스체크 실패! 롤백을 시작합니다..."
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # 백업 파일 존재 확인
            if [ -f /home/${{ secrets.EC2_USER }}/myyak-server.jar.backup ]; then
              echo "백업 파일로 롤백 중..."

              # 새 버전 중지
              sudo systemctl stop myyak || true

              # 백업 파일로 복원
              cp /home/${{ secrets.EC2_USER }}/myyak-server.jar.backup /home/${{ secrets.EC2_USER }}/myyak-server.jar

              # 이전 버전으로 재시작
              sudo systemctl start myyak

              # 롤백 후 상태 확인
              sleep 5
              if sudo systemctl is-active --quiet myyak; then
                echo "롤백 성공! 이전 버전으로 복구되었습니다."
              else
                echo "롤백 후에도 서버 시작 실패"
                sudo journalctl -u myyak -n 50 --no-pager
              fi
            else
              echo "백업 파일이 없습니다. 롤백 불가."
            fi
          ENDSSH

      # 13. 실패 시 로그 확인
      - name: Check logs on failure
        if: failure()
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            echo "=== Application Logs ==="
            sudo journalctl -u myyak -n 100 --no-pager
            echo ""
            echo "=== Service Status ==="
            sudo systemctl status myyak --no-pager
          ENDSSH
