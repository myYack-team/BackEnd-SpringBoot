name: Build and Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 허용

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. application.yaml 생성
      - name: Create application.yaml
        run: |
          mkdir -p src/main/resources
          echo '${{ secrets.APPLICATION_YAML }}' > src/main/resources/application.yaml

      # 5. Firebase 서비스 계정 파일 생성 (classpath에 포함되도록)
      - name: Create Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > src/main/resources/firebase-service-account.json

      # 6. Google Cloud 인증 파일 생성 (classpath에 포함되도록)
      - name: Create Google Cloud credentials
        run: |
          echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS_JSON }}' > src/main/resources/google-cloud-credentials.json

      # 7. Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      # 8. SSH 키 설정
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 9. 기존 JAR 백업
      - name: Backup existing JAR
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            if [ -f /home/${{ secrets.EC2_USER }}/myyak-server.jar ]; then
              cp /home/${{ secrets.EC2_USER }}/myyak-server.jar /home/${{ secrets.EC2_USER }}/myyak-server.jar.backup
              echo "기존 JAR 백업 완료: myyak-server.jar.backup"
            else
              echo "기존 JAR 파일 없음 (첫 배포)"
            fi
          ENDSSH

      # 10. JAR 파일 전송
      - name: Transfer JAR to server
        run: |
          JAR_FILE=$(find ./build/libs -name "myyak-server-*.jar" | head -1)
          echo "Deploying: $JAR_FILE"
          scp "$JAR_FILE" ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/myyak-server.jar

      # 11. Nginx 리버스 프록시 설정 (초기 설치 시에만 설정, 기존 SSL 설정 보호)
      - name: Setup Nginx reverse proxy
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # Nginx 설치 확인
            if ! command -v nginx &> /dev/null; then
              echo "Nginx not installed, installing..."
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            # Nginx 설정이 없을 때만 생성 (기존 SSL 설정 보호)
            if [ ! -f /etc/nginx/sites-available/myyak ]; then
              echo "Nginx 설정 파일 없음 - 초기 설정 생성"
              sudo tee /etc/nginx/sites-available/myyak > /dev/null <<'EOF'
          server {
              listen 80;
              server_name api.myyak.xyz;

              location /.well-known/acme-challenge/ {
                  root /var/www/html;
              }

              location / {
                  return 301 https://$host$request_uri;
              }
          }

          server {
              listen 443 ssl;
              server_name api.myyak.xyz;

              ssl_certificate /etc/letsencrypt/live/api.myyak.xyz/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/api.myyak.xyz/privkey.pem;

              client_max_body_size 20M;

              location / {
                  proxy_pass http://localhost:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;

                  proxy_connect_timeout 300;
                  proxy_send_timeout 300;
                  proxy_read_timeout 300;
              }
          }
          EOF

              sudo ln -sf /etc/nginx/sites-available/myyak /etc/nginx/sites-enabled/myyak
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t && sudo systemctl restart nginx
              echo "Nginx 초기 설정 완료"
            else
              echo "Nginx 설정 이미 존재 - 건너뜀"
              sudo nginx -t && sudo systemctl reload nginx
            fi
          ENDSSH

      # 12. 서버 재시작
      - name: Restart application
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # 기존 프로세스 종료
            sudo systemctl stop myyak || true

            # 애플리케이션 시작
            sudo systemctl start myyak

            # 상태 확인
            sleep 5
            sudo systemctl status myyak
          ENDSSH

      # 13. 헬스체크 (최대 90초 대기, 서버 내부에서 확인)
      - name: Health check
        id: healthcheck
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            echo "Waiting for application to start..."
            for i in 1 2 3 4 5 6; do
              sleep 15
              echo "Attempt $i: Checking health..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v3/api-docs)
              echo "HTTP Status: $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
                echo "Health check passed!"
                exit 0
              fi
            done
            echo "Health check failed after 90 seconds"
            exit 1
          ENDSSH

      # 14. 헬스체크 실패 시 롤백
      - name: Rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "헬스체크 실패! 롤백을 시작합니다..."
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            if [ -f /home/ubuntu/myyak-server.jar.backup ]; then
              echo "백업 파일로 롤백 중..."

              # 자동 재시작 방지를 위해 서비스 일시 비활성화
              sudo systemctl disable myyak

              # 새 버전 중지
              sudo systemctl stop myyak || true
              sleep 3

              # 백업 파일로 복원
              cp /home/ubuntu/myyak-server.jar.backup /home/ubuntu/myyak-server.jar

              # 서비스 다시 활성화 및 시작
              sudo systemctl enable myyak
              sudo systemctl start myyak

              # 롤백 후 상태 확인
              sleep 10
              if sudo systemctl is-active --quiet myyak; then
                echo "롤백 성공! 이전 버전으로 복구되었습니다."
              else
                echo "롤백 후에도 서버 시작 실패"
                sudo journalctl -u myyak -n 50 --no-pager
              fi
            else
              echo "백업 파일이 없습니다. 롤백 불가."
            fi
          ENDSSH

      # 15. 실패 시 로그 확인
      - name: Check logs on failure
        if: failure()
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            echo "=== Application Logs ==="
            sudo journalctl -u myyak -n 100 --no-pager
            echo ""
            echo "=== Service Status ==="
            sudo systemctl status myyak --no-pager
          ENDSSH
