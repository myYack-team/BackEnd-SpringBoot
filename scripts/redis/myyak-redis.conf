# MyYak temporary authentication store
# Install as /etc/redis/myyak-redis.conf and run under systemd as the redis user.

bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 128
timeout 0
tcp-keepalive 300

daemonize no
supervised systemd
loglevel notice
logfile ""

databases 1
dir /var/lib/redis

# OAuth state and one-time codes are intentionally disposable after a Redis restart.
save ""
appendonly no

# t4g.micro starting budget. Re-evaluate with RSS, latency, evictions, and swap metrics.
maxmemory 32mb
maxmemory-policy noeviction

aclfile /etc/redis/myyak-users.acl
