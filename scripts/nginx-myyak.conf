# MyYak Nginx 설정 (AWS용)
# 위치: /etc/nginx/sites-available/myyak
#
# 설치 방법:
# 1. sudo cp nginx-myyak.conf /etc/nginx/sites-available/myyak
# 2. sudo ln -s /etc/nginx/sites-available/myyak /etc/nginx/sites-enabled/
# 3. sudo rm /etc/nginx/sites-enabled/default
# 4. sudo nginx -t
# 5. sudo systemctl reload nginx
# 6. sudo certbot --nginx -d api.myyak.xyz

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.myyak.xyz;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 설정 (Certbot이 자동으로 SSL 설정 추가)
server {
    listen 443 ssl;
    server_name api.myyak.xyz;

    # SSL 인증서 (Certbot이 자동으로 추가)
    # ssl_certificate /etc/letsencrypt/live/api.myyak.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.myyak.xyz/privkey.pem;

    # 업로드 크기 제한 (처방전 이미지 등)
    client_max_body_size 50M;

    # 프록시 설정 (Spring Boot로 전달)
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 지원 (필요시)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 헬스체크 엔드포인트
    location /actuator/health {
        proxy_pass http://localhost:8080/actuator/health;
        access_log off;
    }
}
