plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.myyak'
version = '0.0.1-SNAPSHOT'
description = '마이약 - 복약 관리 앱 백엔드'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starter
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Database
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'

	// .env 파일 로드
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// Swagger (SpringDoc OpenAPI)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// WebClient (외부 API 호출용 - Vision LLM, Kakao OAuth)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Firebase Admin SDK (FCM Push 알림)
	implementation 'com.google.firebase:firebase-admin:9.2.0'

	// Jsoup (HTML 파싱 - 크롤링용)
	implementation 'org.jsoup:jsoup:1.17.2'

	// Apache POI (Excel 파일 읽기)
	implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	// Apache PDFBox (PDF 파싱)
	implementation 'org.apache.pdfbox:pdfbox:3.0.3'

	// Google Cloud Vision (OCR)
	implementation 'com.google.cloud:google-cloud-vision:3.31.0'

	// Caffeine Cache (검색 결과 캐싱)
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

	// DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
