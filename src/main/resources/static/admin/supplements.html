<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영양제 모니터링 - 마이약 관리자</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="마이약" class="logo-img">
                <span>관리자</span>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">🏠 홈</a>
                <a href="data-sync.html" class="nav-link">📊 데이터 수집</a>
                <a href="supplements.html" class="nav-link active">💊 영양제</a>
                <a href="users.html" class="nav-link">👥 가입자</a>
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="main">
        <h1 class="page-title">💊 영양제 모니터링</h1>

        <!-- 최근 등록 영양제 -->
        <div class="card">
            <div class="card-header">최근 등록 영양제</div>
            <div class="card-body">
                <!-- 필터 -->
                <div class="flex items-center gap-2 mb-2">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" style="margin-bottom: 0.25rem;">기간</label>
                        <select class="form-select" id="daysFilter" style="width: 150px;">
                            <option value="">전체</option>
                            <option value="7" selected>최근 7일</option>
                            <option value="14">최근 14일</option>
                            <option value="30">최근 30일</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0; flex: 1;">
                        <label class="form-label" style="margin-bottom: 0.25rem;">검색</label>
                        <div class="flex gap-1">
                            <input type="text" class="form-input" id="searchInput" placeholder="영양제명 검색...">
                            <button class="btn btn-secondary" id="searchBtn">🔍</button>
                        </div>
                    </div>
                </div>

                <!-- 테이블 -->
                <div id="supplementsTable">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>로딩 중...</span>
                    </div>
                </div>

                <!-- 페이지네이션 -->
                <div class="pagination" id="pagination"></div>
            </div>
        </div>

        <!-- 태그별 통계 -->
        <div class="card">
            <div class="card-header">태그별 통계</div>
            <div class="card-body">
                <div id="tagStats">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>로딩 중...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/supplements.js"></script>
</body>
</html>
