<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 상태 - 마이약 관리자</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="마이약" class="logo-img">
                <span>관리자</span>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">홈</a>
                <a href="data-sync.html" class="nav-link">데이터 수집</a>
                <a href="supplements.html" class="nav-link">영양제</a>
                <a href="users.html" class="nav-link">가입자</a>
                <a href="server-status.html" class="nav-link active">서버 상태</a>
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="main">
        <div class="page-header">
            <h1 class="page-title">서버 상태</h1>
            <p class="page-desc">서버 헬스 체크 및 에러 로그를 확인합니다.</p>
        </div>

        <!-- 서버 상태 카드 -->
        <div class="health-card">
            <div class="health-header">
                <div class="health-title">
                    <span>서버 헬스 체크</span>
                </div>
                <button id="healthRefreshBtn" class="btn-refresh">
                    <span class="refresh-icon">&#8635;</span>
                    상태 확인
                </button>
            </div>
            <div class="health-body">
                <!-- 연결 상태 -->
                <div class="health-status-grid">
                    <div class="status-item">
                        <div id="serverStatus" class="status-indicator"></div>
                        <div class="status-label">서버</div>
                        <div class="status-value">-</div>
                    </div>
                    <div class="status-item">
                        <div id="dbStatus" class="status-indicator"></div>
                        <div class="status-label">DB</div>
                        <div class="status-value">-</div>
                    </div>
                    <div class="status-item">
                        <div id="storageStatus" class="status-indicator"></div>
                        <div class="status-label">스토리지</div>
                        <div class="status-value">-</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">응답 시간</div>
                        <div id="responseTime" class="status-value">-</div>
                    </div>
                </div>

                <!-- 리소스 사용량 -->
                <div class="health-resources">
                    <div class="resource-item">
                        <div class="resource-header">
                            <span class="resource-label">메모리 (JVM Heap)</span>
                            <span id="memoryValue" class="resource-value">-</span>
                        </div>
                        <div class="resource-bar">
                            <div id="memoryFill" class="resource-fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="resource-item">
                        <div class="resource-header">
                            <span class="resource-label">CPU</span>
                            <span id="cpuValue" class="resource-value">-</span>
                        </div>
                        <div class="resource-bar">
                            <div id="cpuFill" class="resource-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- 배포 정보 -->
                <div class="health-info">
                    <div class="health-info-row">
                        <span>버전</span>
                        <span id="appVersion">-</span>
                    </div>
                    <div class="health-info-row">
                        <span>빌드 시간</span>
                        <span id="buildTime">-</span>
                    </div>
                    <div class="health-info-row">
                        <span>마지막 확인</span>
                        <span id="lastChecked">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 에러 로그 섹션 -->
        <div class="logs-section">
            <div class="logs-header">
                <h2 class="logs-title">에러 로그</h2>
                <div class="logs-controls">
                    <select id="logLevel" class="log-filter">
                        <option value="">전체 레벨</option>
                        <option value="ERROR">ERROR</option>
                        <option value="WARN">WARN</option>
                        <option value="INFO">INFO</option>
                    </select>
                    <select id="logHours" class="log-filter">
                        <option value="1">최근 1시간</option>
                        <option value="6">최근 6시간</option>
                        <option value="24" selected>최근 24시간</option>
                        <option value="72">최근 3일</option>
                    </select>
                    <button id="logsRefreshBtn" class="btn-refresh">
                        <span class="refresh-icon">&#8635;</span>
                        새로고침
                    </button>
                </div>
            </div>

            <div class="logs-container">
                <div id="logsLoading" class="logs-loading" style="display: none;">
                    <div class="spinner"></div>
                    <span>로그를 불러오는 중...</span>
                </div>
                <div id="logsEmpty" class="logs-empty" style="display: none;">
                    <span>조회된 로그가 없습니다.</span>
                </div>
                <table id="logsTable" class="logs-table" style="display: none;">
                    <thead>
                        <tr>
                            <th style="width: 150px;">시간</th>
                            <th style="width: 70px;">레벨</th>
                            <th style="width: 200px;">로거</th>
                            <th>메시지</th>
                            <th style="width: 100px;">액션</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                    </tbody>
                </table>
            </div>

            <!-- 페이지네이션 -->
            <div id="logsPagination" class="pagination" style="display: none;">
                <button id="logsPrevBtn" class="page-btn">&lt; 이전</button>
                <span id="logsPageInfo" class="page-info">1 / 1</span>
                <button id="logsNextBtn" class="page-btn">다음 &gt;</button>
            </div>
        </div>
    </main>

    <!-- AI 채팅 사이드바 -->
    <div id="chatSidebar" class="chat-sidebar">
        <div class="chat-header">
            <h3>AI 에러 분석</h3>
            <button id="chatCloseBtn" class="chat-close-btn">&times;</button>
        </div>
        <div class="chat-error-context">
            <div class="error-context-header">분석 대상 에러</div>
            <div id="chatErrorInfo" class="error-context-body">
                <div class="error-context-row">
                    <span class="error-context-label">시간:</span>
                    <span id="chatErrorTime" class="error-context-value">-</span>
                </div>
                <div class="error-context-row">
                    <span class="error-context-label">레벨:</span>
                    <span id="chatErrorLevel" class="error-context-value">-</span>
                </div>
                <div class="error-context-row">
                    <span class="error-context-label">메시지:</span>
                    <span id="chatErrorMessage" class="error-context-value">-</span>
                </div>
            </div>
        </div>
        <div id="chatMessages" class="chat-messages">
            <!-- 채팅 메시지들 -->
        </div>
        <div class="chat-input-container">
            <textarea id="chatInput" class="chat-input" placeholder="질문을 입력하세요..." rows="2"></textarea>
            <button id="chatSendBtn" class="chat-send-btn">전송</button>
        </div>
    </div>

    <!-- 오버레이 (사이드바 열릴 때) -->
    <div id="chatOverlay" class="chat-overlay"></div>

    <script src="js/api.js"></script>
    <script src="js/server-status.js"></script>
</body>
</html>
