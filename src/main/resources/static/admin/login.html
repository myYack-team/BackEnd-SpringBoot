<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>관리자 로그인 · 마이약</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
    <main class="login-card">
        <img src="images/logo.png" alt="마이약" width="120">
        <p class="login-eyebrow">관리자 콘솔</p>
        <h1>안전하게 로그인하세요</h1>
        <p>등록된 관리자 메일로 일회용 인증 코드를 보냅니다.</p>
        <button type="button" id="send-code" class="btn btn-primary">인증 코드 보내기</button>
        <form id="verify-form" hidden>
            <label for="code">이메일 인증 코드</label>
            <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
                   pattern="[0-9]{9}" minlength="9" maxlength="9" required placeholder="9자리 숫자">
            <p class="login-hint">코드는 5분 동안 유효합니다.</p>
            <button class="btn btn-primary" type="submit">로그인</button>
        </form>
        <p id="login-message" role="status" aria-live="polite"></p>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
