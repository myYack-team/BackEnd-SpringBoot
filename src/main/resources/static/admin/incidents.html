<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장애 대응 · 마이약 관리자</title>
    <link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/shell.css">
</head>
<body>
<header class="header"></header>
<main class="main console-main">
    <div class="page-heading"><div><p class="eyebrow">INCIDENTS</p><h1>장애 대응</h1><p>분석부터 PR 검증, 메일 승인과 배포까지 처리 이력을 확인하세요.</p></div>
        <button class="btn btn-secondary" id="incidents-refresh">새로고침</button></div>
    <div class="notice">승인·반려·재분석은 해당 보고서 메일에 안내된 문구로 답장해 주세요. 승인은 메일에 표시된 PR 커밋에만 적용됩니다.</div>
    <p class="inline-error" id="incidents-error" role="alert"></p>
    <div class="incident-workspace">
        <section class="panel incident-master" aria-label="장애 대응 목록">
            <div class="panel-heading"><h2>최근 이력</h2><span class="muted">최근 30일 보관</span></div>
            <div id="incident-items" class="incident-list" aria-live="polite"><p class="empty-state">이력을 불러오는 중입니다.</p></div>
            <button class="btn btn-secondary load-more" id="incidents-more" hidden>이전 이력 더 보기</button>
        </section>
        <section class="panel incident-detail" id="incident-detail" tabindex="-1" aria-label="장애 대응 상세" aria-live="polite">
            <div class="empty-state">목록에서 사건을 선택하면 분석 결과와 처리 이력이 표시됩니다.</div>
        </section>
    </div>
</main>
<script src="js/session.js"></script><script src="js/shell.js"></script><script src="js/api.js"></script><script src="js/incidents.js"></script>
</body>
</html>
