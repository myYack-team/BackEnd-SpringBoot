<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가입자 통계 - 마이약 관리자</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="마이약" class="logo-img" style="height: 80px !important;">
                <span>관리자</span>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">홈</a>
                <a href="data-sync.html" class="nav-link">데이터 수집</a>
                <a href="supplements.html" class="nav-link">영양제</a>
                <a href="users.html" class="nav-link active">가입자</a>
                <a href="qna.html" class="nav-link">Q&A<span id="nav-qna-badge" class="nav-badge hidden"></span></a>
                <a href="server-status.html" class="nav-link">서버 상태</a>
                <a href="client-errors.html" class="nav-link">클라이언트 에러</a>
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="main">
        <h1 class="page-title">👥 가입자 통계</h1>

        <!-- 가입자 현황 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">전체 가입자</div>
                <div class="stat-value primary" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">이번 달</div>
                <div class="stat-value" id="monthUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최근 7일</div>
                <div class="stat-value" id="weekUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">오늘</div>
                <div class="stat-value success" id="todayUsers">-</div>
            </div>
        </div>

        <!-- 성별/연령대 분포 -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
            <!-- 성별 분포 -->
            <div class="card">
                <div class="card-header">👫 성별 분포</div>
                <div class="card-body">
                    <div id="genderChart">
                        <div class="loading">
                            <div class="spinner"></div>
                            <span>로딩 중...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 연령대 분포 -->
            <div class="card">
                <div class="card-header">📈 연령대 분포</div>
                <div class="card-body">
                    <div id="ageChart">
                        <div class="loading">
                            <div class="spinner"></div>
                            <span>로딩 중...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 가입목적 분포 -->
        <div class="card">
            <div class="card-header">🎯 가입 목적 분포</div>
            <div class="card-body">
                <div id="purposeChart">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>로딩 중...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 최근 7일 가입 추이 -->
        <div class="card">
            <div class="card-header">📅 최근 7일 가입 추이</div>
            <div class="card-body">
                <div id="dailyChart">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>로딩 중...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 사용자 목록 -->
        <div class="card">
            <div class="card-header">
                <span>📋 사용자 목록</span>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="text" id="userSearch" placeholder="이름, 이메일, 카카오ID 검색"
                           style="padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; width: 200px;">
                    <button id="searchBtn" class="btn btn-secondary" style="padding: 0.5rem 1rem;">검색</button>
                    <button id="deleteSelectedBtn" class="btn btn-danger" style="padding: 0.5rem 1rem;" disabled>
                        선택 삭제 (<span id="selectedCount">0</span>명)
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div id="userListContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>로딩 중...</span>
                    </div>
                </div>
                <!-- 페이지네이션 -->
                <div id="userPagination" class="pagination" style="margin-top: 1rem; display: flex; justify-content: center; gap: 0.5rem;">
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
